# Image-GS 重實作設定檔
# 改參數只要改這裡；程式用 config.load_config() 讀進來。
# 每個欄位標了它在哪個 Step 開始被用到。

# ---- 輸入影像（Step 1）----
downsample: 4            # 2k 圖縮成 1/4 邊長(~512)，純 PyTorch 才跑得動

# ---- 高斯（Step 2）----
num_gaussians: 5000
init_mode: gradient      # gradient(梯度引導) | random(對照組)
init_random_ratio: 0.3   # gradient 模式下仍有這比例隨機散佈(避免平坦區沒高斯)
init_scale: 5.0          # 初始高斯半徑(像素，std)
inverse_scale: true      # 論文預設：參數存 1/s，收斂更快更好(Eq.2 footnote)

# ---- 渲染（Step 3）----
topk: 10                 # 每像素只取最近 K 個高斯(論文做法)；0 = 全量(較慢)
tile_size: 64            # >0：tile 渲染(切方塊+剔除遠處高斯，快)；0：全量 all-pairs(慢)。純PyTorch最佳~64

# ---- 訓練（Step 4）----
max_steps: 2000
pos_lr: 0.3             # 注意：像素座標，位置 lr 比官方[0,1]空間大很多
scale_lr: 2.0e-3
rot_lr: 2.0e-3
feat_lr: 5.0e-3
ssim_loss_ratio: 0.1   # 總 loss = L1 + ratio*(1-SSIM)；0 則只用 L1
eval_steps: 100        # 每幾步印一次 PSNR
save_image_steps: 50  # 每幾步存一張重建圖；0 = 不定期存
save_on_add: true      # 每次 progressive 補高斯後也存一張
# lr 衰減 / 早停
lr_schedule: true
decay_ratio: 10.0      # 沒進步時 lr 除以這個數
check_decay_steps: 1000  # 連續這麼多步沒進步才衰減
max_decay_times: 1     # 最多衰減幾次(超過就早停)
decay_threshold: 1.0e-3

# ---- 漸進最佳化（Step 5）----
progressive: true
initial_ratio: 0.5     # 一開始只放總數的這個比例
add_times: 4           # 分幾次把高斯加到 num_gaussians
add_steps: 300         # 每隔幾步加一次
post_min_steps: 800    # 加滿後至少再訓練幾步

# ---- 量化／壓縮（Step 6）----
quantize: false
pos_bits: 16
scale_bits: 16
rot_bits: 16
feat_bits: 16

# ---- 影像空間 ----
gamma: 2.2             # gamma 校正；殘差在 gamma 空間計算可減少新增高斯的黑塊

# ---- 裝置／輸出 ----
device: auto           # auto -> 依序 cuda > mps > cpu；也可寫死 "cuda"/"cpu"
out_dir: src/image_gs_implementation/outputs
seed: 123
